name: Python application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Format code with black (don't fail)
      run: |
        pip install black
        black .
      continue-on-error: true

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --max-line-length=120 --ignore=E203,W503,E501 --exclude=.venv,venv,__pycache__
      continue-on-error: true

    - name: Test PyTorch import and CUDA
      run: |
        python -c "import torch; print('PyTorch:', torch.__version__, '| CUDA:', torch.cuda.is_available())"

    - name: Verify U-Net model can be imported
      run: |
        python -c "from models.u2net_model import UNet; print('✓ Model import successful')"
